<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<script src="https://d3js.org/d3.v7.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
	<script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
	<script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
	<script src="https://unpkg.com/peerjs@1.0.4/dist/peerjs.min.js"></script>
	<!-- <script src="https://unpkg.com/visconnect@1.1.1/visconnect-bundle.js"></script> -->
	<title>VisChatter</title>
</head>

<body collaboration="live" custom-events="vl-spec,chart-comment,chart-comment-delete,chart-comments-clear,chart-delete,chart-move,chart-resize,board-clear" ignore-events="SpeechRecognitionEvent,aiAssistToggle">
    <header id="headline">
        <a class="brand" href="./" aria-label="VisChatter home"><h1>VisChatter</h1></a>
        <div class="header-statuses" data-visconnect-local>
            <div id="connection-status" class="header-status" data-state="connecting" role="status" aria-live="polite">
                <span class="connection-dot" aria-hidden="true"></span><span id="connection-status-text">Connecting…</span>
            </div>
            <div id="model-status" class="header-status model-status" role="status" aria-live="polite" aria-busy="false" hidden>
                <span class="loading-spinner" aria-hidden="true"></span><span>Waiting for model response</span>
            </div>
        </div>
        <div class="header-buttons">
            <label class="model-control" for="model-select" data-visconnect-local>Model
                <select id="model-select" aria-label="OpenRouter model">
                    <option value="deepseek/deepseek-v4.1-flash">DeepSeek V4.1 Flash</option>
                    <option value="nvidia/nemotron-3.5-lightning:free">Nemotron 3.5 Lightning (free)</option>
                    <option value="openai/gpt-6.1-sol">GPT-6.1 Sol</option>
                </select>
            </label>
            <div class="visconnect-container"></div>
            <span id="current-profile" data-visconnect-local hidden></span>
        </div>
    </header>

    <main id="whiteboard" aria-label="Visualization whiteboard" data-visconnect-local>
        <div id="vis-container" aria-label="Charts"></div>
        <div class="toolkit-dock" data-visconnect-local>
            <section id="live-transcript" aria-label="Live transcript" hidden>
                <div class="transcript-heading">
                    <span id="transcript-indicator" class="record-dot" aria-hidden="true"></span><strong id="transcript-status">Live Transcript</strong>
                    <button id="transcript-toggle" type="button" aria-label="Hide transcript" title="Hide transcript" aria-controls="transcript-text" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
                </div>
                <p id="transcript-text" role="status" aria-live="polite"></p>
            </section>
            <div id="toolkit" role="toolbar" aria-label="Whiteboard toolkit">
                <button id="addButton" type="button" class="tool-button add-tool"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add</span></button>
                <button id="clearButton" type="button" class="tool-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4 6 6-10 10H6l-4-4L15 4Z"/><path d="m8 10 6 6M11 20h10"/></svg><span>Clear</span></button>
                <span class="tool-divider" aria-hidden="true"></span>
                <button id="recordButton" type="button" class="tool-button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg><span id="record-label">Record</span></button>
            </div>
        </div>
        <div id="board-notice" role="status" data-visconnect-local hidden></div>
        <div id="chart-menu" role="menu" aria-label="Visualization actions" data-visconnect-local hidden>
            <button type="button" role="menuitem" data-action="comment">Comment <span aria-hidden="true">↵</span></button>
            <button type="button" role="menuitem" data-action="speech">Speech comment</button>
            <button id="chart-share-button" type="button" role="menuitem" data-action="share" aria-haspopup="menu" aria-expanded="false" aria-controls="chart-share-menu">Share <span aria-hidden="true">›</span></button>
            <div id="chart-share-menu" role="menu" aria-label="Share visualization" hidden>
                <button type="button" role="menuitem" data-action="copy-code">Copy code to clipboard</button>
                <button type="button" role="menuitem" data-action="download-svg">Download SVG</button>
                <button type="button" role="menuitem" data-action="download-png">Download PNG</button>
            </div>
            <div class="menu-divider" role="separator"></div>
            <button type="button" role="menuitem" data-action="clear-comments">Clear all comments</button>
            <button type="button" role="menuitem" data-action="delete" class="danger-text">Delete</button>
        </div>
        <section id="comment-editor" role="dialog" aria-modal="false" aria-labelledby="comment-title" data-visconnect-local hidden>
            <form id="comment-form" novalidate>
                <div class="editor-heading"><h2 id="comment-title">Comment</h2><button id="close-comment-button" type="button" class="icon-button" aria-label="Close comment">×</button></div>
                <label class="sr-only" for="comment-input">Chart comment</label>
                <textarea id="comment-input" placeholder="Comment…" required></textarea>
                <p id="comment-status" class="comment-status" role="status" aria-live="polite" hidden></p>
                <div class="editor-footer"><button id="speech-comment-button" type="button" class="secondary-button" aria-pressed="false">Speech comment</button><button id="comment-button" type="submit" class="primary-button">Post</button></div>
            </form>
        </section>
    </main>

    <dialog id="username-dialog" class="board-dialog username-dialog" aria-labelledby="username-title" data-visconnect-local>
        <form id="username-form" novalidate>
            <div class="dialog-heading"><h2 id="username-title">Choose a username</h2></div>
            <label for="username-input">Username</label>
            <div class="username-field"><span id="username-preview" aria-hidden="true"></span><input id="username-input" name="username" type="text" maxlength="40" autocomplete="nickname" aria-describedby="username-error" required></div>
            <p id="username-error" class="form-error" role="alert" hidden></p>
            <div class="dialog-footer"><button id="username-submit" type="submit" class="primary-button">Join</button></div>
        </form>
    </dialog>

    <dialog id="add-dialog" class="board-dialog" aria-labelledby="add-title" data-visconnect-local>
        <form id="add-form" novalidate>
            <div class="dialog-heading"><h2 id="add-title">Add a visualization</h2><button type="button" class="icon-button" data-close-dialog="add-dialog" aria-label="Close add visualization">×</button></div>
            <p class="dialog-description">Paste your Vega-Lite specification below.</p>
            <div class="visualization-examples" role="group" aria-label="Example Vega-Lite specifications">
                <button type="button" class="example-capsule" data-visualization-example="0" aria-pressed="false" aria-controls="input" title="Number of car registrations in Europe in 2019 , by segment (in 1,000s)" aria-label="Use example 1: Number of car registrations in Europe in 2019 , by segment (in 1,000s)">Number of c...</button>
                <button type="button" class="example-capsule" data-visualization-example="1" aria-pressed="false" aria-controls="input" title="Small car and minicar sales in Europe, 2013–2020" aria-label="Use example 2: Small car and minicar sales in Europe, 2013–2020">Small car a...</button>
            </div>
            <label class="sr-only" for="input">Vega-Lite JSON specification</label>
            <textarea id="input" placeholder='{"data": {"values": [...]}, "mark": "bar", "encoding": {...}}' spellcheck="false" required></textarea>
            <p id="add-error" class="form-error" role="alert" hidden></p>
            <div class="dialog-footer"><button type="button" class="secondary-button" data-close-dialog="add-dialog">Cancel</button><button id="renderButton" type="submit" class="primary-button">Add</button></div>
        </form>
    </dialog>

    <div id="visPlayground" hidden></div>
    <canvas id="canvas" hidden></canvas>
    <script src="src/connect.js"></script>
    <script src="src/visconnect-bundle.js"></script>
    <script src="src/identity.js"></script>
    <script src="src/util.js"></script>
    <script src="src/js.js"></script>
    <script src="src/drag.js"></script>
    <script src="src/highlight.js"></script>
    <script src="src/vega.js"></script>
    <script src="src/share.js"></script>
    <script src="src/delete.js"></script>
</body>
</html>
